<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src data:; media-src https://*.cdninstagram.com https://*.fbcdn.net; connect-src 'none'; object-src 'none'; form-action 'none'; base-uri 'none'">
  <title>Yildirim's Instagram</title>
  <link rel="stylesheet" href="./style.css?v=0.5.0">
  <script src="./app.js?v=0.5.0" type="module"></script>
</head>
<body>
  <main>
    <header>
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><span></span></span>
        <h1>Yildirim's Instagram</h1>
      </div>
      <div class="tools">
        <p id="connection" role="status">Checking extension…</p>
        <a class="download" href="./stillroom-extension.zip?v=0.5.0" download>Download extension</a>
      </div>
    </header>
    <div class="thread" id="thread" role="log" aria-label="Conversation">
    </div>
    <div class="composer">
      <button id="summarize" type="button">Summarize Instagram</button>
      <form id="chat">
        <label class="sr-only" for="prompt">Message</label>
        <input id="prompt" maxlength="250" placeholder="Or ask about a topic or @account…" autocomplete="off" required>
        <button id="send" aria-label="Send message" title="Send message" type="submit">↑</button>
      </form>
    </div>
  </main>
</body>
</html>
