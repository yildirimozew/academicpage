<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yildirim's Instagram options</title>
  <link rel="stylesheet" href="options.css">
  <script src="options.js" defer></script>
</head>
<body>
  <main>
    <h1>DeepSeek</h1>
    <p>When enabled, the extension sends your prompt and candidate Instagram images, captions, and handles to DeepSeek for relevance review. It only shows items selected after that review.</p>
    <form id="settings">
      <label for="api-key">DeepSeek API key</label>
      <input id="api-key" type="password" autocomplete="off" spellcheck="false" required maxlength="160">
      <div class="actions">
        <button id="save" type="submit">Save and enable</button>
        <button id="remove" type="button" disabled>Disable DeepSeek</button>
      </div>
    </form>
    <p id="status" role="status"></p>
  </main>
</body>
</html>
